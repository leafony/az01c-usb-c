name: KiCad PDFs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kicad-pdfs-${{ github.ref }}
  # Finish an output update before starting the next main build.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Generate PDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # KiCad 10.0.8; the digest also pins the underlying build environment.
      image: ghcr.io/kicad/kicad:10.0.8@sha256:3f4a01786dfbe803a65f345c3342b765db9add913f5e9448f8356793714ddc34
      options: --user 0
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out design files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate schematic and layout PDFs
        run: |
          # The container user differs from the owner of the mounted checkout.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/export-pdfs.sh
          git diff --exit-code -- kicad/

      - name: Upload PDFs for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kicad-pdfs
          path: |
            output/schematic.pdf
            output/layout.pdf
          if-no-files-found: error
          retention-days: 14

  update-output:
    name: Update output PDFs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Check that this is still the latest main commit
        id: latest
        run: |
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; skipping this older build.'
          fi

      - name: Download the PDFs generated by this run
        if: steps.latest.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kicad-pdfs
          path: output/

      - name: Commit updated PDFs
        if: steps.latest.outputs.current == 'true'
        run: |
          git add -- output/schematic.pdf output/layout.pdf
          if git diff --cached --quiet; then
            echo 'PDFs are unchanged; no commit is needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '回路図・レイアウトPDFを自動更新' -m "Source: $GITHUB_SHA"
          # A concurrent main update rejects this push instead of overwriting it.
          # Pushes made with GITHUB_TOKEN do not trigger another workflow run.
          git push origin HEAD:main
